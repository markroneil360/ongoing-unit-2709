name: R6E8A current 24-hour window

on:
  push:
    branches: [main]
    paths:
      - 'tools/current_window.py'
      - '.github/workflows/current-window.yml'
  schedule:
    - cron: '35 15 * * *'   # 11:35 AM EDT
    - cron: '35 16 * * *'   # 11:35 AM EST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r6e8a-current-window
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install 'obspy>=1.5' numpy scipy
      - name: Build current HDF and EHZ window
        run: python3 tools/current_window.py
      - name: Commit current window
        run: |
          git config user.name 'r6e8a-bot'
          git config user.email 'r6e8a-bot@users.noreply.github.com'
          git add data/current-window.json
          if git diff --cached --quiet; then
            echo 'No current-window changes.'
          else
            git commit -m "Update R6E8A 11 AM current window ($(TZ=America/Detroit date '+%Y-%m-%d %H:%M ET'))"
            git push
          fi
