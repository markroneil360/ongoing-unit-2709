name: R6E8A post-5PM availability probe

on:
  push:
    branches:
      - r6e8a-local-preview-current-20260815
    paths:
      - '.github/workflows/current-preview-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install obspy numpy scipy
      - name: Find latest retrievable minute and analyze edge
        shell: bash
        run: |
          python3 - <<'PY'
          import io,json,urllib.request,urllib.error
          from datetime import datetime,timezone,timedelta
          from zoneinfo import ZoneInfo
          import numpy as np
          from scipy.signal import welch
          from obspy import read,Stream
          TZ=ZoneInfo('America/Detroit')
          base='https://data.raspberryshake.org/fdsnws/dataselect/1/query'
          candidates=[datetime.fromisoformat(f'2026-08-15T{hh}:{mm}:00+00:00') for hh,mm in [(21,'00'),(21,'02'),(21,'04'),(21,'06'),(21,'08'),(21,'10')]]
          # Also retain the known successful 20:54 boundary.
          known=datetime.fromisoformat('2026-08-15T20:54:00+00:00')
          latest=known; successful=[]; failures=[]
          def fmt(d):return d.strftime('%Y-%m-%dT%H:%M:%S')
          for end in candidates:
              start=end-timedelta(minutes=5)
              url=(f'{base}?net=AM&sta=R6E8A&loc=00&cha=HDF&start={fmt(start)}&end={fmt(end)}&format=miniseed&nodata=404')
              req=urllib.request.Request(url,headers={'User-Agent':'R6E8A-probe/1.0'})
              try:
                  raw=urllib.request.urlopen(req,timeout=60).read()
                  st=read(io.BytesIO(raw))
                  if len(st):
                      successful.append(fmt(end)); latest=max(latest,end)
              except Exception as e:
                  failures.append({'end':fmt(end),'error':str(e)})
          # analyze from 45m before known boundary through latest if latest advanced
          start=known-timedelta(minutes=45); end=latest
          url=(f'{base}?net=AM&sta=R6E8A&loc=00&cha=HDF&start={fmt(start)}&end={fmt(end)}&format=miniseed&nodata=404')
          req=urllib.request.Request(url,headers={'User-Agent':'R6E8A-probe-analysis/1.0'})
          raw=urllib.request.urlopen(req,timeout=120).read(); st=read(io.BytesIO(raw)); st.merge(method=0); st=st.split()
          latest_sample=max(float(tr.stats.endtime.timestamp) for tr in st)
          mp={};bands=[('1-4',1,4),('4-8',4,8),('8-16',8,16),('16-20',16,20)]
          for tr in st:
              sr=float(tr.stats.sampling_rate);n=int(round(sr*60));ts0=float(tr.stats.starttime.timestamp);xall=np.asarray(tr.data,float)
              first=int(np.ceil(max(start.timestamp(),ts0)/60))*60
              last=int(np.floor(min(end.timestamp()-60,float(tr.stats.endtime.timestamp)-59.99)/60))*60
              for ep in range(first,last+1,60):
                  i0=int(round((ep-ts0)*sr))
                  if i0<0 or i0+n>len(xall):continue
                  if abs((ts0+i0/sr)-ep)>.51/sr:continue
                  x=xall[i0:i0+n]
                  if len(x)!=n or not np.isfinite(x).all():continue
                  x=x-x.mean();f,p=welch(x,fs=sr,window='hann',nperseg=int(round(sr*8)),noverlap=int(round(sr*4)),detrend=False,scaling='density')
                  means={}
                  for name,lo,hi in bands:
                      m=(f>=lo)&(f<hi if hi<20 else f<=hi);means[name]=float(np.mean(p[m]))
                  mp[ep]=max(means,key=means.get)
          boundary=int(known.timestamp())
          rows=[{'epoch':k,'dominant':mp[k]} for k in sorted(mp)]
          runs=[];run=[]
          for r in rows:
              if r['dominant']=='4-8':
                  if run and r['epoch']!=run[-1]['epoch']+60:runs.append(run);run=[]
                  run.append(r)
              else:
                  if run:runs.append(run);run=[]
          if run:runs.append(run)
          tail=[r for r in rows if r['epoch']>=boundary]; tail48=[r for r in tail if r['dominant']=='4-8']
          summaries=[]
          for r in runs:
              s=r[0]['epoch'];e=r[-1]['epoch']+60
              summaries.append({'start_utc':datetime.fromtimestamp(s,timezone.utc).isoformat(),'end_utc':datetime.fromtimestamp(e,timezone.utc).isoformat(),'minutes':len(r),'crosses_boundary':s<boundary<e,'minutes_after_boundary':sum(1 for x in r if x['epoch']>=boundary)})
          out={'generated_utc':datetime.now(timezone.utc).isoformat(),'successful_candidate_ends_utc':successful,'failed_candidates':failures,'latest_retrievable_requested_end_utc':latest.isoformat(),'latest_retrievable_requested_end_et':latest.astimezone(TZ).strftime('%Y-%m-%d %I:%M %p %Z'),'latest_sample_et':datetime.fromtimestamp(latest_sample,TZ).strftime('%Y-%m-%d %I:%M:%S %p %Z'),'tail_analyzed_minutes':len(tail),'tail_dom48_minutes':len(tail48),'tail_dom48_hours':round(len(tail48)/60,2),'overlap_runs_4_8':summaries,'source_url':url}
          open('data/current-preview-probe.json','w').write(json.dumps(out,indent=2));print(json.dumps(out,indent=2))
          PY
      - name: Commit result
        run: |
          git config user.name 'r6e8a-preview-bot'
          git config user.email 'r6e8a-preview-bot@users.noreply.github.com'
          git add data/current-preview-probe.json
          git commit -m 'Probe exact post-5PM R6E8A archive edge' || true
          git push
