name: Hourly R6E8A FDSN status

on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-fdsn-status
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install waveform dependency
        run: pip install "obspy>=1.5"
      - name: Pull current public FDSN status
        run: python3 tools/hourly_fdsn_status.py
      - name: Commit status if changed
        run: |
          git config user.name "r6e8a-bot"
          git config user.email "r6e8a-bot@users.noreply.github.com"
          git add data/current-status.json
          if git diff --cached --quiet; then
            echo "No status change."
          else
            git commit -m "Hourly R6E8A FDSN status ($(TZ=America/Detroit date '+%Y-%m-%d %H:%M ET'))"
            git push
          fi
