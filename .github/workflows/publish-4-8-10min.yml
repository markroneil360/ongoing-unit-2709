name: Publish verified R6E8A 10-minute dashboard

on:
  push:
    branches: [main]
    paths:
      - data/r6e8a_4_8_10min_full.json
      - .github/workflows/publish-4-8-10min.yml
      - scripts/generate_reports.py
  workflow_dispatch:
  workflow_run:
    workflows:
      - "R6E8A 10-minute current-tail refresh"
    types: [completed]

permissions:
  contents: write

concurrency:
  group: r6e8a-publish-10min-dashboard
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install status dependency
        run: pip install 'obspy>=1.4' reportlab
      - name: Refresh separate HDF and EHZ current-edge status
        run: python3 tools/hourly_fdsn_status.py
      - name: Patch dashboard and run five publication-integrity checks
        run: python3 tools/publish_4_8_10min.py
      - name: Build checked 24-hour and 7-day PDF reports from the minute cache
        run: python3 scripts/generate_reports.py
      - name: Commit only after all publication and report checks pass
        run: |
          git config user.name 'r6e8a-publish-bot'
          git config user.email 'r6e8a-publish-bot@users.noreply.github.com'
          git add index.html data/current-status.json data/r6e8a-report-manifest.json downloads/R6E8A-24-hour-report.pdf downloads/R6E8A-7-day-trailing-report.pdf
          if git diff --cached --quiet; then
            echo 'Dashboard already matches verified candidate.'
          else
            git commit -m 'Publish verified R6E8A dashboard, separate channels, and cached PDF reports'
            git pull --rebase origin main
            python3 scripts/generate_reports.py --verify-only
            git push
          fi
