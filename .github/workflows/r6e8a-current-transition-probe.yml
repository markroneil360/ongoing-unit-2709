name: R6E8A neutral current-transition probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/r6e8a-current-transition-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'obspy>=1.5' numpy scipy
      - name: Analyze neutral current environmental window
        run: |
          python3 - <<'PY'
          import io,json,math,urllib.request
          from datetime import datetime,timezone
          from zoneinfo import ZoneInfo
          import numpy as np
          from obspy import read,UTCDateTime
          from scipy.signal import welch
          F='https://data.raspberryshake.org/fdsnws/dataselect/1/query'; TZ=ZoneInfo('America/Detroit')
          start=datetime(2026,9,9,22,30,tzinfo=timezone.utc); end=datetime(2026,9,9,23,6,tzinfo=timezone.utc)
          bands=(("1-4",1,4),("4-8",4,8),("8-16",8,16),("16-20",16,20))
          def pull(c):
            u=f'{F}?net=AM&sta=R6E8A&loc=00&cha={c}&start={start.strftime("%Y-%m-%dT%H:%M:%SZ")}&end={end.strftime("%Y-%m-%dT%H:%M:%SZ")}&format=miniseed&nodata=404'
            try:
              with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'r6e8a-transition-probe/1.0'}),timeout=180) as r: raw=r.read()
            except Exception as e: return None,u,str(e)
            st=read(io.BytesIO(raw)); st.merge(method=0,fill_value=None); return st,u,None
          def complete(st,m):
            t=UTCDateTime(m)
            for tr in st:
              sr=float(tr.stats.sampling_rate); n=int(round(sr*60)); dt=1/sr
              if not 95<=sr<=105 or tr.stats.starttime>t+dt/2 or tr.stats.endtime<t+60-dt*1.5: continue
              i=int(round((t-tr.stats.starttime)*sr)); x=tr.data[i:i+n] if i>=0 and i+n<=len(tr.data) else []
              if len(x)!=n: continue
              if np.ma.isMaskedArray(x) and np.any(np.ma.getmaskarray(x)): continue
              x=np.asarray(x,float)
              if np.all(np.isfinite(x)): return x,sr
          def classify(x,sr):
            f,p=welch(x,fs=sr,window='hann',nperseg=min(int(sr*8),len(x)),noverlap=min(int(sr*4),len(x)-1),detrend='constant',scaling='density')
            vals=[]
            for j,(nm,lo,hi) in enumerate(bands):
              mask=(f>=lo)&((f<=hi) if j==3 else (f<hi)); vals.append(float(np.mean(p[mask])))
            return bands[int(np.argmax(vals))][0]
          out={}; latest={}; errors={}
          for c in ('HDF','EHZ'):
            st,u,e=pull(c)
            if e: errors[c]=e; continue
            latest[c]=max(tr.stats.endtime for tr in st).datetime.replace(tzinfo=timezone.utc).astimezone(TZ).isoformat()
            rows=[]; m=start
            while m<end:
              g=complete(st,m)
              if g:
                x,sr=g; x=x-np.mean(x); rows.append({'time_et':m.astimezone(TZ).isoformat(),'rms_counts':float(np.sqrt(np.mean(x*x))),'band':classify(x,sr) if c=='HDF' else None})
              m=m.replace(second=0,microsecond=0)+__import__('datetime').timedelta(minutes=1)
            out[c]=rows
          h=out.get('HDF',[]); e=out.get('EHZ',[])
          checks=[not errors,len(h)>0,len(e)>0,len({x['time_et'] for x in h})==len(h),all(x['band'] in {'1-4','4-8','8-16','16-20'} for x in h)]
          result={'latest':latest,'errors':errors,'HDF':h,'EHZ':e,'sanity_checks':checks,'all_five_sanity_checks_pass':all(checks)}
          print('R6E8A_TRANSITION_RESULT='+json.dumps(result,separators=(',',':')))
          if not all(checks): raise SystemExit('transition probe validation failed')
          PY
