name: R6E8A full 4-8 Hz 10-minute recalculation

on:
  push:
    branches: [main]
    paths:
      - tools/recalculate_4_8_10min.py
      - .github/workflows/recalculate-4-8-10min.yml
      - .recalculate-4-8-10min-trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r6e8a-full-4-8-10min
  cancel-in-progress: false

jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install calculation dependencies
        run: pip install 'obspy>=1.4' numpy scipy
      - name: Full Apr 12 to current recalculation and five validation gates
        run: python3 tools/recalculate_4_8_10min.py
      - name: Commit verified candidate only
        run: |
          git config user.name 'r6e8a-refresh-bot'
          git config user.email 'r6e8a-refresh-bot@users.noreply.github.com'
          git add data/r6e8a_4_8_10min_full.json
          if git diff --cached --quiet; then
            echo 'Candidate unchanged.'
          else
            git commit -m 'R6E8A full 10-minute sustained recalculation (five checks passed)'
            git pull --rebase origin main
            git push
          fi
