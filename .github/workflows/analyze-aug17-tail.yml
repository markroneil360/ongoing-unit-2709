name: Analyze Aug 17 R6E8A tail

on:
  push:
    branches: [main]
    paths:
      - tools/analyze_aug17_tail.py
      - .github/workflows/analyze-aug17-tail.yml
      - .analyze-aug17-tail-trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r6e8a-aug17-tail
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install 'obspy>=1.4' numpy scipy
      - name: Pull and analyze 10:40-11:30 PM EDT tail
        run: python3 tools/analyze_aug17_tail.py
      - name: Commit verified tail
        run: |
          git config user.name 'r6e8a-analysis-bot'
          git config user.email 'r6e8a-analysis-bot@users.noreply.github.com'
          git add data/r6e8a_aug17_tail.json
          git commit -m 'R6E8A Aug 17 tail analysis (five checks passed)'
          git pull --rebase origin main
          git push origin main
