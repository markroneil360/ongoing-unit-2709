name: R6E8A semester Wall of Shame analysis fast

on:
  push:
    branches: [main]
    paths:
      - tools/compute_semester_summary_fast.py
      - .github/workflows/compute-semester-summary-fast.yml
      - .semester-summary-fast-trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r6e8a-semester-analysis-fast
  cancel-in-progress: false

jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install calculation dependencies
        run: pip install 'obspy>=1.4' numpy scipy
      - name: Calculate and validate semester rollups with three sanity checks
        run: python3 tools/compute_semester_summary_fast.py
      - name: Commit analysis-only output
        run: |
          git config user.name 'r6e8a-analysis-bot'
          git config user.email 'r6e8a-analysis-bot@users.noreply.github.com'
          git add data/semester_summary_fast.json
          if git diff --cached --quiet; then
            echo 'Fast semester analysis unchanged.'
          else
            git commit -m 'R6E8A fast semester Wall of Shame analysis (three checks passed)'
            git pull --rebase origin main
            git push
          fi
