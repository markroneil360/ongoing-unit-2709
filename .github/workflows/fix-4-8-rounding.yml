name: Fix R6E8A 4-8 Hz rounding reconciliation

on:
  push:
    branches: [main]
    paths:
      - tools/fix_4_8_rounding_reconciliation.py
      - .github/workflows/fix-4-8-rounding.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact-minute reconciliation correction
        run: python3 tools/fix_4_8_rounding_reconciliation.py
      - name: Commit correction
        run: |
          git config user.name 'r6e8a-refresh-bot'
          git config user.email 'r6e8a-refresh-bot@users.noreply.github.com'
          git add index.html
          git commit -m 'Use exact minutes for R6E8A 4-8 Hz reconciliation'
          git pull --rebase origin main
          git push origin main
